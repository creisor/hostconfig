---
- name: clone dotfiles repo
  git:
    repo: git@github.com:creisor/dotfiles.git
    dest: "{{ansible_facts['user_dir']}}/git/dotfiles"
    accept_hostkey: yes

- name: run dotfiles linking script
  command: "{{ansible_facts['user_dir']}}/.dotfiles/link_dotfiles.sh"
