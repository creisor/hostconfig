---
- name: clone neovim dotfiles repo
  ansible.builtin.git:
    repo: git@github.com:creisor/dotconfig-nvim.git
    dest: "{{ansible_facts['user_dir']}}/git/dotconfig-nvim"
    accept_hostkey: yes

- name: symlink nvim config
  file:
    src: "{{ansible_facts['user_dir']}}/git/dotconfig-nvim"
    dest: "{{ansible_facts['user_dir']}}/.config/nvim"
    owner: "{{ansible_user}}"
    state: link

- name: clone vimrc repo
  git:
    repo: git@github.com:creisor/.vim.git
    dest: "{{ansible_facts['user_dir']}}/git/.vim"
    accept_hostkey: yes

- name: symlink .vimrc
  file:
    src: "{{ansible_facts['user_dir']}}/git/.vim/vimrc"
    dest: "{{ansible_facts['user_dir']}}/.vimrc"
    owner: "{{ansible_user}}"
    state: link
